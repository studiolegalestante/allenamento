<style>
/* Layout: una colonna da telefono, testata sticky con i giorni, schede esercizio, barra timer fissa in basso */
:root{

:root[data-theme="dark"]{
  --bg:#0f1418; --card:#182027; --fg:#e8edf1; --muted:#9aa6b1; --line:#2a343d;

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

iate, piedi a terra. Manubri all'altezza del petto alto, gomiti a 45° dal busto. Spingi in alto ed espira, scendi in 2-3 secondi.","Pettorale (parte alta), deltoide anteriore, tricipite"],"en":["Incline dumbbell press","Backrest at about 30°, neutral or semi-pronated grip","Adjustable bench backrest at about 30° (2nd notch). Back and head supported, feet on the floor. Dumbbells at upper-chest level, elbows 45° from the torso. Press up as you exhale, lower in 2-3 seconds.","Pectorals (upper), front deltoid, triceps"],"kg":["10","12","14"],"q":"panca inclinata manubri 30 gradi esecuzione corretta"},"chest_press":{"it":["Chest press alla macchina","Maniglie all'altezza del petto, primo giorno peso leggero","Regola il sedile in modo che le maniglie siano all'altezza del centro del petto. Schiena appoggiata, spingi in avanti senza bloccare i gomiti, torna lento fino a sentire l'allungamento sul petto.","Pettorale, deltoide anteriore, tricipite"],"en":["Machine chest press","Handles at chest height, light weight on day one","Set the seat so the handles line up with the middle of the chest. Back against the pad, press forward without locking the elbows, return slowly until you feel a stretch in the chest.","Pectorals, front deltoid, triceps"],"kg":["20","25","30"],"q":"chest press macchina esecuzione corretta"},"shoulder_m":{"it":["Shoulder press alla macchina","Seduto con lo schienale, mai sopra la testa con la schiena inarcata","Sulla stessa macchina in posizione shoulder press: sedile regolato con le maniglie all'altezza delle spalle, schiena appoggiata. Spingi in alto senza bloccare i gomiti, scendi lento. La lombare resta sullo schienale.","Deltoide, tricipite, trapezio superiore"],"en":["Machine shoulder press","Seated with back support, never arching the lower back","On the same machine in shoulder-press position: seat set so the handles are at shoulder height, back supported. Press up without locking the elbows, lower slowly. Lower back stays on the pad.","Deltoids, triceps, upper trapezius"],"kg":["15","20","25"],"q":"shoulder press macchina seduto esecuzione"},"pushdown":{"it":["Push-down al cavo con corda","Gomiti fermi ai fianchi, apri la corda in fondo","In piedi davanti al cavo alto con la corda. Gomiti attaccati ai fianchi, distendi le braccia verso il basso aprendo le mani in fondo al movimento, pausa 1 secondo, risali lento fino a 90°.","Tricipite"],"en":["Cable rope push-down","Elbows fixed at the sides, spread the rope at the bottom","Stand facing the high pulley with the rope. Elbows tight to your sides, extend the arms down spreading the hands at the bottom, pause 1 second, return slowly to 90°.","Triceps"],"kg":["15","20","25"],"q":"pushdown tricipiti cavo corda esecuzione corretta"},"pulley":{"it":["Pulley basso seduto con barra a V","Busto fermo e dritto, tira verso l'ombelico","Seduto alla stazione del cavo basso con la barra a V, piedi in appoggio, ginocchia leggermente piegate. Busto dritto e fermo, tira la maniglia verso l'ombelico stringendo le scapole, torna lento senza piegarti in avanti.","Gran dorsale, romboidi, trapezio medio, bicipite"],"en":["Seated cable row with V-bar","Torso still and upright, pull toward the navel","Sit at the low cable station with the V-bar, feet braced, knees slightly bent. Torso upright and still, pull the handle to the navel squeezing the shoulder blades, return slowly without leaning forward.","Latissimus dorsi, rhomboids, mid trapezius, biceps"],"kg":["30","35","40"],"q":"pulley basso seduto triangolo esecuzione corretta"},"facepull":{"it":["Face pull al cavo con corda","Carico leggero, gomiti alti","Cavo all'altezza del viso con la corda. Tira verso la fronte aprendo le mani e portando i gomiti in alto e indietro, stringi le scapole 1 secondo, torna lento. Busto fermo.","Deltoide posteriore, trapezio medio, cuffia dei rotatori, romboidi"],"en":["Cable rope face pull","Light load, elbows high","Cable at face height with the rope. Pull toward the forehead spreading the ha at sulla panca con kettlebell (goblet)","Kettlebell al petto, tocca la panca e risali","In piedi davanti alla panca, kettlebell tenuto con due mani al petto, piedi alla larghezza delle spalle. Scendi portando il bacino indietro fino a sfiorare la panca, risali spingendo sui talloni con il busto dritto.","Quadricipite, glutei, core"],"en":["Goblet box squat with kettlebell","Kettlebell at the chest, touch the bench and stand","Stand in front of the bench holding a kettlebell at the chest with both hands, feet shoulder-width. Lower by pushing the hips back until you brush the bench, stand up driving through the heels with the torso upright.","Quadriceps, glutes, core"],"kg":["8","12","12"],"q":"goblet squat kettlebell su panca esecuzione"},"polp_lp":{"it":["Polpacci alla leg press","Solo avampiedi sulla pedana, ginocchia distese ma non bloccate","Seduto alla leg press, solo gli avampiedi sul bordo basso della pedana. Ginocchia distese ma non bloccate, spingi sulle punte il più possibile, pausa 1 secondo, torna lento lasciando scendere i talloni.","Polpaccio (gastrocnemio, soleo)"],"en":["Leg-press calf raises","Only the balls of the feet on the platform, knees straight but not locked","Seated at the leg press, only the balls of the feet on the lower edge of the platform. Knees straight but not locked, push through the toes as far as possible, pause 1 second, return slowly letting the heels drop.","Calves (gastrocnemius, soleus)"],"kg":["40","50","60"],"q":"calf raise alla leg press esecuzione"},"foam":{"it":["Foam roller","Lento, mai sulla zona lombare","Sdraiati con il rullo sotto la zona da trattare e scorri lentamente avanti e indietro per circa 1 minuto per zona: cosce davanti, dietro e di lato, glutei (seduto sul rullo), dorsali (sdraiato sul fianco, braccio sopra la testa). Fermati qualche secondo sui punti più tesi. Non usarlo sulla zona lombare.","Quadricipite, femorali, glutei, gran dorsale"],"en":["Foam roller","Slow, never on the lower back","Lie with the r
