<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alimentazione</title>
<meta name="theme-color" content="#141b22">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f7;--card:#fff;--fg:#141b22;--muted:#56616d;--line:#d9dfe5;
  --tr:#1f5fa8;--rest:#13756b;--cheat:#b5520f;--warn:#8a5a00;--warnbg:#fff4d6;--done:#1d7a3a;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1418;--card:#182027;--fg:#e8edf1;--muted:#9aa6b1;--line:#2a343d;
  --tr:#5b9be6;--rest:#3fb3a5;--cheat:#ec8a46;--warn:#f0c14b;--warnbg:#3a2f12;--done:#58c27a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding:0 max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.5px}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:600 14px var(--body);padding:6px 10px;min-height:36px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 15px var(--body);min-height:40px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:2px solid var(--k);background:transparent;color:var(--k);border-radius:10px;padding:6px 0 4px;font:700 15px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.day small{font-size:13px;line-height:1}
.day[aria-pressed="true"]{background:var(--k);color:var(--card)}
.day .oggi{position:absolute;top:-8px;right:-3px;background:var(--fg);color:var(--bg);font-size:9px;padding:1px 4px;border-radius:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;color:var(--k,var(--fg));display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font:500 13px var(--body);color:var(--muted);text-transform:none;text-align:right;max-width:45%}
.badge{display:inline-block;font:700 13px var(--body);padding:3px 8px;border-radius:6px;background:var(--k);color:var(--card)}
.blk{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.blk:first-of-type{border-top:0;padding-top:0}
.blk .ic{font-size:20px;text-align:center}
.blk .what{display:flex;flex-direction:column}
.blk .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.blk .nm{font-weight:600}
.blk .q{font-size:14px;color:var(--muted)}
.cook{display:block;margin-top:4px;font-size:14px;line-height:1.35;background:var(--bg);border-radius:8px;padding:6px 8px}
.alt{border:0;background:transparent;color:var(--k,var(--fg));font:700 13px var(--body);padding:2px 0;cursor:pointer;text-decoration:underline}
.chg{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:600 13px var(--body);padding:6px 8px;min-height:36px;cursor:pointer;white-space:nowrap}
.tot{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--k,var(--fg))}
.row{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px}
.muted{color:var(--muted);font-size:14px}
ul{margin:0;padding-left:20px}
li{margin:2px 0}
.chk{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;margin:1px 0 0}
.chk.on .it{text-decoration:line-through;color:var(--muted)}
.chk .qq{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chk .sub{display:block;font-size:13px;color:var(--muted)}
h3{font:700 13px var(--body);text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:6px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);font:600 14px var(--body);padding:6px 10px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.term{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:2px}
.term::after{content:"ⓘ";font-size:.75em;margin-left:1px;vertical-align:super;opacity:.7}
#gl[hidden]{display:none}
#gl{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
#gl .box{background:var(--card);color:var(--fg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#gl b{font-family:var(--display);font-size:22px;text-transform:uppercase}
#gl p{margin:0}
footer{font-size:12px;color:var(--muted);text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>Alimentazione</h1>
    <div class="nav"><a class="btn" href="./" aria-label="Torna all'allenamento">🏋️ Allenamento</a></div>
  </div>
  <div class="tabs" role="group" id="tabs">
    <button type="button" data-t="giorno" aria-pressed="true">🍽️ Giorno</button>
    <button type="button" data-t="spesa" aria-pressed="false">🛒 Spesa</button>
    <button type="button" data-t="info" aria-pressed="false">ℹ️ Regole</button>
  </div>
  <div class="days" role="group" id="days"></div>
</header>
<main id="main" class="wrap" style="gap:14px"></main>
<div id="gl" hidden><div class="box" role="dialog" aria-live="polite"><b></b><p></p><button type="button" class="chg" onclick="this.closest('#gl').hidden=true">Chiudi</button></div></div>
<footer>Indicazioni generali per uso personale: non sostituiscono il parere del medico o del nutrizionista.</footer>
</div>

const CARB_REST=0.7; // a riposo i carboidrati della cena scendono al 70%
// Cene della settimana tipo (in linea con le due spese DOK)
const DEF_PROT={0:'pollo',2:'uova',3:'macinato',5:'tacchino',6:'tonno'};

const SGARRI={1:{t:'Panino o panzerotto',tips:['Panino: hamburger singolo, senza doppia salsa; patatine piccole o niente.','Panzerotto: uno solo, meglio al forno; da bere acqua o una bibita zero.','A pranzo resta sulle proteine (yogurt greco, bresaola), così arrivi alla sera con margine.']},

// Spese DOK: A domenica sera o lunedì (Lun–Mer), B giovedì (Gio–Dom)
const SPESE=[{id:'A',n:'Spesa A',q:'domenica sera o lunedì',from:0,to:2,buy:0},{id:'B',n:'Spesa B',q:'giovedì',from:3,to:6,buy:3}];

/* ===== Stato ===== */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=store.get('alim',{we:'sab',sel:{}});
const todayIdx=(new Date().getDay()+6)%7;
let curDay=todayIdx, tab='giorno';
function weekKey(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}
function save(){store.set('alim',S)}

function isTrain(d){return d===0||d===2||d===4||(S.we==='sab'?d===5:d===6)}
function isCheat(d){return d in SGARRI}
function dayType(d){return isTrain(d)?'tr':'rest'}
function meals(d){ // blocchi del giorno
  const m=[];
  m.push(isTrain(d)?{id:'shake',t:'Dopo l\'allenamento'}:{id:'shakeR',t:'Shake'});
  m.push({id:'pranzo',t:'Pranzo'});
  if(!isCheat(d))['prot','carb','verd','grassi','fine'].forEach(b=>m.push({id:b,t:'Cena',cena:true}));
  return m;
}
function defIdx(d,b){
  if(b==='prot'){let p=DEF_PROT[d];if(S.we==='dom'&&(d===5||d===6))p=DEF_PROT[d===5?6:5];const i=B.prot.o.findIndex(o=>o.id===p);return i<0?0:i}
  if(b==='carb'){let c=DEF_CARB[d];if(S.we==='dom'&&(d===5||d===6))c=DEF_CARB[d===5?6:5];return c||0}
  if(b==='verd')return d%2?1:0;
  if(b==='grassi')return d%3;
  if(b==='fine')return 0;
  if(b==='pranzo')return 0;
  return 0;
}
function selIdx(d,b){const s=S.sel[d]&&S.sel[d][b];return s==null?defIdx(d,b):s%B[b].o.length}
function items(d,b){ // [alimento, grammi] effettivi
  const o=B[b].o[selIdx(d,b)];let it=o.it.map(x=>x.slice());
  if(b==='carb'&&!isTrain(d))it=it.map(([f,g])=>[f,Math.round(g*CARB_REST/10)*10]);
  if(b==='grassi'){const p=B.prot.o[selIdx(d,'prot')];if(p.oil)it=[['olio',p.oil]];}
  return it;
}
function weekNo(){return Math.floor(new Date(weekKey()+'T00:00:00')/6048e5)}
function cookKey(d,b){const o=B[b].o[selIdx(d,b)];return b==='prot'?o.id:b+':'+o.n}
function cookList(d,b){const k=cookKey(d,b);return b==='prot'?COOK[k]:COOK2[k]}
function cookIdx(d,b){const L=cookList(d,b).length,k=cookKey(d,b);const c=S.cook&&S.cook[d]&&S.cook[d][k];return c==null?(weekNo()+d)%L:c%L}
function cookLine(d,b){const L=cookList(d,b);if(!L)return '';const [t,x]=L[cookIdx(d,b)];
  return `<span class="cook">👨‍🍳 <b>${t}</b> — ${x}${L.length>1?` <button class="alt" data-k="${b}">🔄 Altro modo</button>`:''}</span>`}
function grassiName(d){const p=B.prot.o[selIdx(d,'prot')];return p.oil?'1 cucchiaio d\'olio (c\'è il salmone)':B.grassi.o[selIdx(d,'grassi')].n}
function nut(it){let k=0,p=0;it.forEach(([f,g])=>{k+=F[f].k*g/100;p+=F[f].p*g/100});return{k,p}}
function fmtQ(f,g){if(f==='tonno')return Math.round(g/52)+' scatolette da 80 g';if(f==='uova')return Math.round(g/55)+' uova';if(f==='latte')return g+' ml';return g+' g'}
function qText(it){return it.map(([f,g])=>{const x=F[f];let q=fmtQ(f,g);if(f==='olio')q=g/10===1?'1 cucchiaio':g/10+' cucchiai';
  if(['yogurt','skyr','budino'].includes(f))q=g+' g';if(['frutto','banana'].includes(f))q=Math.round(g/x.u[0])===1?'1':Math.round(g/x.u[0]);if(f==='barretta')q='1';
  return x.n+' '+q}).join(' · ')}

/* ===== Viste ===== */
const $=s=>document.querySelector(s);
function renderDays(){
  const el=$('#days');el.hidden=tab!=='giorno';
  el.innerHTML=DOW.map((n,d)=>{const k=isCheat(d)?'var(--cheat)':isTrain(d)?'var(--tr)':'var(--rest)';const ic=isCheat(d)?(isTrain(d)?'🏋️🍕':'🍕'):isTrain(d)?'🏋️':'😴';
   return `<button class="day" data-d="${d}" style="--k:${k}" aria-pressed="${d===curDay}">${n}<small>${ic}</small>${d===todayIdx?'<span class="oggi">OGGI</span>':''}</button>`}).join('');
}
function blockRow(d,b,label){
  const it=items(d,b);const nm=b==='grassi'?grassiName(d):B[b].o[selIdx(d,b)].n;const can=!(b==='grassi'&&B.prot.o[selIdx(d,'prot')].oil);
  return `<div class="blk"><div class="ic">${B[b].ic}</div><div class="what"><span class="lab">${label||B[b].lab}</span><span class="nm">${nm}</span><span class="q">${it.length?qText(it):'—'}</span>${cookLine(d,b)}</div>${can?`<button class="chg" data-b="${b}">🔄 Cambia</button>`:''}</div>`;
}
function renderGiorno(){
  const d=curDay,tp=dayType(d),T=TARGET[tp];const k=isCheat(d)?'var(--cheat)':tp==='tr'?'var(--tr)':'var(--rest)';
  let all=[];meals(d).forEach(m=>all=all.concat(items(d,m.id)));const N=nut(all);
  let h=`<section class="card" style="--k:${k}"><h2>${DOWL[d]} <span class="badge">${isTrain(d)?'🏋️ Allenamento':'😴 Riposo'}${isCheat(d)?' · 🍕 Sgarro':''}</span></h2>
   <div class="muted">${tp==='tr'?'Circa 2.200 kcal':'Circa 1.900 kcal'}, proteine 170–180 g. Cena alle 21–21:30.</div></section>`;
  const sh=meals(d)[0];
  h+=`<section class="card" style="--k:${k}"><h2>${sh.t}<small>${isTrain(d)?'subito dopo la palestra':'se non pranzi, prendilo a metà giornata'}</small></h2>${blockRow(d,sh.id)}</section>`;
  h+=`<section class="card" style="--k:${k}"><h2>Pranzo</h2>${blockRow(d,'pranzo')}</section>`;
  if(isCheat(d)){const s=SGARRI[d];
    h+=`<section class="card" style="--k:var(--cheat)"><h2>🍕 Cena libera<small>${s.t}</small></h2><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul><div class="muted">Le calorie dello sgarro non sono nel totale qui sotto.</div></section>`;
  }else{
    const c=['prot','carb','verd','grassi','fine'];let cit=[];c.forEach(b=>cit=cit.concat(items(d,b)));const CN=nut(cit);
    h+=`<section class="card" style="--k:${k}"><h2>Cena<small>${Math.round(CN.k)} kcal · ${Math.round(CN.p)} g prot.</small></h2>${c.map(b=>blockRow(d,b)).join('')}`;
    const w=freshWarn(d);if(w)h+=`<div class="warn">${w}</div>`;
    if(!isTrain(d))h+=`<div class="muted">Giorno di riposo: carboidrati ridotti al 70%.</div>`;
    h+=`</section>`;
  }
  const pk=Math.min(100,N.k/T.k*100),pp=Math.min(100,N.p/T.p[0]*100);
  h+=`<section class="card tot" style="--k:${k}"><h2>Totale del giorno</h2>
   <div class="row"><span>Calorie</span><span>${Math.round(N.k)} / ${T.k} kcal${isCheat(d)?' + sgarro':''}</span></div><div class="bar"><i style="width:${pk}%"></i></div>
   <div class="row"><span>Proteine</span><span>${Math.round(N.p)} / ${T.p[0]}–${T.p[1]} g</span></div><div class="bar"><i style="width:${pp}%"></i></div>
   <button class="chg" id="resetDay" style="align-self:flex-start">↩︎ Ripristina il giorno</button></section>`;
  $('#main').innerHTML=h;
}
function spesaOf(d){return SPESE.find(s=>d>=s.from&&d<=s.to)}
function freshWarn(d){
  const sp=spesaOf(d);const late=d-sp.buy;const out=[];
  ['prot'].forEach(b=>items(d,b).forEach(([f])=>{const x=F[f];if(x.cat==='fresco'&&x.shelf<late)out.push(x.n.toLowerCase())}));
  return out.length?`🧊 ${out.join(', ')}: compralo con la ${sp.n} e mettilo in freezer il giorno stesso; scongelalo in frigo la sera prima.`:'';
}
function packs(f,g){const x=F[f];const n=Math.max(1,Math.ceil(g/x.pack[0]-0.05));return n+' × '+x.pack[1]}
function needQty(f,g){const x=F[f];if(f==='uova')return Math.round(g/55)+' uova';if(f==='tonno')return Math.round(g/52)+' scatolette';
  if(['yogurt','skyr','budino'].includes(f))return Math.round(g/x.pack[0])+' vasetti';if(['frutto','banana'].includes(f))return Math.round(g/x.u[0])+' pezzi';if(f==='barretta')return Math.round(g/60)+' barrette';
  if(f==='latte')return g+' ml';if(f==='olio')return Math.round(g/10)+' cucchiai';if(f==='whey')return Math.round(g/40)+' dosi';return g+' g'}
function collect(from,to){const tot={},use={};for(let d=from;d<=to;d++)meals(d).forEach(m=>items(d,m.id).forEach(([f,g])=>{tot[f]=(tot[f]||0)+g;(use[f]=use[f]||new Set()).add(DOW[d])}));return{tot,use}}
function renderSpesa(){
  const wk=weekKey();if(S.chkWeek!==wk){S.chkWeek=wk;S.chk={};save()}
  let h=`<section class="card"><h2>Spesa DOK</h2><div class="muted">Due spese a settimana, prodotti Selex dove possibile. La lista segue le scelte fatte con 🔄 Cambia. Le spunte si azzerano ogni lunedì.</div>
   <div>Giorno di allenamento nel weekend: <span class="seg" id="we"><button type="button" data-we="sab" aria-pressed="${S.we==='sab'}">Sabato</button><button type="button" data-we="dom" aria-pressed="${S.we==='dom'}">Domenica</button></span></div></section>`;
  const week=collect(0,6);
  SPESE.forEach(sp=>{const {tot,use}=collect(sp.from,sp.to);const fr=Object.keys(tot).filter(f=>F[f].cat==='fresco');
    h+=`<section class="card" style="--k:${sp.id==='A'?'var(--tr)':'var(--rest)'}"><h2>${sp.id==='A'?'🟢':'🔵'} ${sp.n}<small>${sp.q} · ${DOW[sp.from]}–${DOW[sp.to]}</small></h2>${list(fr,tot,use,sp.id)}`;
    if(sp.id==='A'){const sg=Object.keys(week.tot).filter(f=>F[f].cat==='surg');if(sg.length)h+=`<h3>➕ Surgelati della settimana</h3>${list(sg,week.tot,week.use,'S')}`}
    h+=`</section>`});
  const dp=Object.keys(week.tot).filter(f=>F[f].cat==='disp');
  h+=`<section class="card" style="--k:var(--muted)"><h2>🟤 Dispensa<small>consumo della settimana · rifornisci quando sta finendo</small></h2>${list(dp,week.tot,week.use,'D')}
   <h3>Basi della cucina (quando finiscono)</h3><ul><li>Passata di pomodoro, limoni, salsa di soia, aceto.</li><li>Spezie: paprika, origano, rosmarino, aglio in polvere, cumino, cannella.</li><li>Pangrattato e farina (per cotolette e scaloppine).</li></ul><h3>Integratori</h3><ul><li>Whey isolate Decathlon: sopra, nel conteggio.</li><li>Omega-3 con certificazione IFOS: 1 al giorno, a cena.</li><li>Creatina Creapure: solo dopo le analisi con la creatinina.</li><li>Vitamina D: solo dopo averla misurata.</li></ul></section>`;
  $('#main').innerHTML=h;
}
function list(fs,tot,use,pre){
  const order=Object.keys(F);fs.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return fs.map(f=>{const id=pre+':'+f;const on=!!(S.chk&&S.chk[id]);const x=F[f];
    return `<label class="chk${on?' on':''}"><input type="checkbox" data-c="${id}"${on?' checked':''}><span class="it">${x.dok}<span class="sub">${needQty(f,tot[f])} · ${[...use[f]].join(', ')}</span></span><span class="qq">${packs(f,tot[f])}</span></label>`}).join('')||'<div class="muted">Niente da comprare.</div>';
}
function renderInfo(){
  $('#main').innerHTML=`
  <section class="card"><h2>🧱 Come funziona</h2><ul>
   <li>Ogni pasto è fatto di blocchi. 🔄 Cambia propone un alimento equivalente (stesse proteine, calorie simili).</li>

   <li>Niente ricette: padella, forno, friggitrice ad aria o microonde, al massimo 15 minuti.</li>

   <li>Grammature a crudo per pasta, riso e cous cous; il resto come si compra.</li></ul></section>
  <section class="card"><h2>📅 La settimana</h2><ul>
   <li>🏋️ Allenamento la mattina presto: lunedì, mercoledì, venerdì e sabato o domenica (si sceglie nella scheda Spesa).</li>
   <li>Shake subito dopo la palestra, pranzo facoltativo, cena completa alle 21–21:30.</li>
   <li>A riposo i carboidrati della cena scendono al 70% e lo shake si prende quando si vuole.</li>
   <li>🍕 Sgarri: martedì (panino o panzerotto) e venerdì (pizza o sushi).</li></ul></section>
  <section class="card"><h2>🧊 Freschezza</h2><ul>
   <li>Pesce fresco e macinato: entro 1 giorno dall'acquisto.</li>
   <li>Pollo e tacchino: entro 2 giorni.</li>
   <li>Uova, yogurt, albume, pane in cassetta: tutta la settimana.</li>
   <li>Se un fresco va oltre, l'app lo segnala: freezer il giorno della spesa, scongelamento in frigo la sera prima.</li></ul></section>
  <section class="card"><h2>💊 Integratori</h2><ul>
   <li>Whey isolate Decathlon, omega-3 IFOS.</li>
   <li>Creatina Creapure e vitamina D: solo dopo le analisi.</li></ul></section>`;
}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab));renderDays();
  if(tab==='giorno')renderGiorno();else if(tab==='spesa')renderSpesa();else renderInfo();linkTerms(document.getElementById('main'))}


/* ===== Glossario cliccabile ===== */
const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRE=new RegExp('(?<![\\p{L}])('+GKEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','giu');
function linkTerms(root){root.querySelectorAll('.card').forEach(card=>{const seen=new Set();
  const w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('button,.term,label input')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;GRE.lastIndex=0;let m,last=0,frag=null;
   while((m=GRE.exec(t))){const k=m[1].toLowerCase();if(seen.has(k))continue;seen.add(k);frag=frag||document.createDocumentFragment();
    frag.append(t.slice(last,m.index));const b=document.createElement('button');b.type='button';b.className='term';b.dataset.g=k;b.textContent=m[1];frag.append(b);last=m.index+m[1].length}
   if(frag){frag.append(t.slice(last));n.replaceWith(frag)}})})}
function showGloss(k){const g=document.getElementById('gl');g.querySelector('b').textContent=k.charAt(0).toUpperCase()+k.slice(1).replace(/^Sgocciolat$/,'Sgocciolato');g.querySelector('p').textContent=GLOSS[k];g.hidden=false}

/* ===== Eventi ===== */
document.addEventListener('click',e=>{
  const gl=document.getElementById('gl');if(!gl.hidden&&!e.target.closest('#gl .box')){gl.hidden=true;if(!e.target.closest('.term'))return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.g){e.preventDefault();showGloss(t.dataset.g);return}
  if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0);return}
  if(t.dataset.d){curDay=+t.dataset.d;render();return}
  if(t.dataset.b){const b=t.dataset.b;S.sel[curDay]=S.sel[curDay]||{};S.sel[curDay][b]=(selIdx(curDay,b)+1)%B[b].o.length;save();render();return}
  if(t.dataset.we){S.we=t.dataset.we;save();render();return}
  if(t.dataset.k){const b=t.dataset.k,k=cookKey(curDay,b);S.cook=S.cook||{};S.cook[curDay]=S.cook[curDay]||{};S.cook[curDay][k]=cookIdx(curDay,b)+1;save();render();return}
  if(t.id==='resetDay'){if(S.cook)delete S.cook[curDay];}
  if(t.id==='resetDay'){delete S.sel[curDay];save();render();return}
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;S.chk=S.chk||{};if(e.target.checked)S.chk[c]=1;else delete S.chk[c];save();e.target.closest('.chk').classList.toggle('on',e.target.checked)});
render();
</script>
